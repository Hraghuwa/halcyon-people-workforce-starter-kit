  var DEFAULT_LIMITS = { maxOvertime: 10, minRest: 12, autoConfirm: false, crossStore: false };
  function limitModifiers(l) {
    const now = { revenue: 0, trust: 0, morale: 0, risk: 0 };
    const carry = { revenue: 0, trust: 0, morale: 0, risk: 0 };
    if (l.maxOvertime === 14) {
      now.revenue += 1;
      carry.morale -= 2;
      carry.risk += 1;
    }
    if (l.maxOvertime === 6) {
      now.revenue -= 1;
      now.morale += 1;
    }
    if (l.minRest === 10) {
      now.revenue += 1;
      carry.morale -= 1;
      carry.risk += 2;
    }
    if (l.autoConfirm) {
      now.risk += 1;
    }
    if (l.crossStore) {
      now.revenue += 1;
      now.morale -= 1;
    }
    return { now, carry };
  }

    }

      MEASURES.forEach((k) => {

        carry[k] += hiring.carry[k];
      });
      note.push("Round 1 hiring settings applied");
    }

    if (hit)

        deltas[k] += hit.now?.[k] ?? 0;

    const after = { ...g.measures };
    MEASURES.forEach((k) => {
      after[k] = clamp(after[k] + deltas[k]);
    });
    const b = s.shared.boardRule;
    const boardSteppedIn = after.trust < b.trustBelow || after.morale < b.moraleBelow || after.risk > b.riskAbove;
    if (boardSteppedIn)
      note.push("The board steps in");
    const result = {
      round: g.round,
      choice: choiceId,
      deltas,
      after,
      cost: c.cost,
      dataPoints: c.dataPoints,
      staffingCoverage: c.staffingCoverage,
      boardSteppedIn,
      note
    };
    return {
      measures: after,
      round: g.round + 1,
      budgetUsed: g.budgetUsed + c.cost,
      dataUsed: g.dataUsed + c.dataPoints,
      carry,
      history: [...g.history, result],
      finished: g.round === s.rounds.length
    };
  }
  function companyScore(m) {
    return Math.round(0.25 * (m.revenue + m.trust + m.morale + (100 - m.risk)) * 10) / 10;
  }

  // src/engine/shiftFillAgent.ts
  function rng(seed) {
    return () => {
      seed |= 0;
      seed = seed + 1831565813 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // src/engine/hiringAgent.ts
  var DEFAULT_HIRING_LIMITS = { overbook: 1.3, reviewCapacity: 240, balancePins: true, idFirst: false };
  function makeApplicants(seed = 11, n = 8400, cities = 9) {
    const r = rng(seed);
    return Array.from({ length: n }, (_, id) => {
      const lowIncomePin = r() < 0.4, gender = r() < 0.45 ? "F" : "M";
      const idBad = r() < (lowIncomePin ? 0.15 : 0.07);
      return {
        id,
        city: Math.floor(r() * cities),
        gender,
        lowIncomePin,
        age: 16 + Math.floor(r() * 30),
        gapMonths: Math.floor(r() * r() * 30 * (gender === "F" ? 1.8 : 1)),
        distanceKm: Math.round(r() * (lowIncomePin ? 30 : 18)),
        availableDay: 1 + Math.floor(r() * 5),
        id_check: idBad ? r() < 0.55 ? "mismatch" : "unreadable" : "ok"
      };
    });
  }
  var quitProb = (a) => Math.min(0.8, 0.3 + 0.012 * a.distanceKm + (a.availableDay > 3 ? 0.05 : 0));
  var rate = (all, pick, short) => {
    const g = all.filter(pick);
    return g.length ? g.filter((a) => short.has(a.id)).length / g.length : 0;
  };
  function runHiringAgent(apps, vacancies = 600, cities = 9, limits = DEFAULT_HIRING_LIMITS) {
    const log = [];
    log.push({ step: "perceive", text: `${apps.length} applications, ${vacancies} places across ${cities} cities.` });
    const adults = apps.filter((a) => a.age >= 18);
    const idBad = (a) => a.id_check !== "ok";
    const pool = limits.idFirst ? adults.filter((a) => !idBad(a)) : adults;
    const perCity = Math.ceil(vacancies / cities * limits.overbook), ranked = [];
    const byRank = (a, b) => a.availableDay - b.availableDay || a.distanceKm - b.distanceKm;
    for (let c = 0;c < cities; c++) {
      const inCity = pool.filter((a) => a.city === c);
      const groups = limits.balancePins ? [inCity.filter((a) => a.lowIncomePin), inCity.filter((a) => !a.lowIncomePin)] : [inCity];
      for (const g of groups)
        ranked.push(...g.sort(byRank).slice(0, Math.round(perCity * g.length / (inCity.length || 1))));
    }
    const idCasesAll = limits.idFirst ? adults.filter(idBad) : ranked.filter(idBad);
    const review = idCasesAll.slice(0, limits.reviewCapacity).map((a) => ({ id: a.id, reason: `ID ${a.id_check}` }));
    const deferred = idCasesAll.length - review.length;
    const shortlist = ranked.filter((a) => !idBad(a));
    log.push({ step: "plan", text: `${pool.length} ranked, ${shortlist.length} shortlisted with clear ID. ${idCasesAll.length} ID cases for recruiters (${deferred} wait: queue full).` });
    const short = new Set(shortlist.map((a) => a.id));
    const rates = {
      women: rate(adults, (a) => a.gender === "F", short),
      men: rate(adults, (a) => a.gender === "M", short),
      lowIncomePin: rate(adults, (a) => a.lowIncomePin, short),
      otherPin: rate(adults, (a) => !a.lowIncomePin, short)
    };
    const pair = (x, y) => Math.min(x, y) / Math.max(x, y || 1);
    const ratio = Math.min(pair(rates.women, rates.men), pair(rates.lowIncomePin, rates.otherPin));
    const fairness = { rates, ratio, passed: ratio >= 0.8 };
    log.push({ step: "reflect", text: `Shortlisted ${shortlist.length}. Fairness ratio ${ratio.toFixed(2)} -> ${fairness.passed ? "passed" : "BLOCKED: recruiter lead must sign off"}.` });
    return { applicants: apps.length, vacancies, shortlist, review, deferred, idCases: idCasesAll.length, fairness, log, audit: [] };
  }
  function sendOffers(run, recruiter, ids, fairnessSignoffBy) {
    if (!recruiter)
      throw new Error("Governance rule 3: no offer without a recruiter's approval");
    if (!run.fairness.passed && !fairnessSignoffBy)
      throw new Error("Fairness gate failed: lead sign-off required");
    const ok = new Set(run.shortlist.map((a) => a.id)), sent = ids.filter((id) => ok.has(id));
    sent.forEach((id) => run.audit.push(`offer ${id} approved by ${recruiter}${fairnessSignoffBy ? ` (fairness signed off by ${fairnessSignoffBy})` : ""}`));
    return sent;
  }
  function simulateOutcome(run, cities = 9, seed = 3, showUp = 0.85) {
    const r = rng(seed), perCityPlaces = Math.ceil(run.vacancies / cities), hires = [];
    for (let c = 0;c < cities; c++)
      hires.push(...run.shortlist.filter((a) => a.city === c && r() < showUp).slice(0, perCityPlaces));
    const filled = Math.min(run.vacancies, hires.length);
    const stay = hires.length ? hires.reduce((s, a) => s + 1 - quitProb(a), 0) / hires.length : 0;
    return { filled, fillRate: filled / run.vacancies, stay30: stay, stayers: Math.round(filled * stay) };
  }
  var PERSON_BASELINE = { fillRate: 0.45, stay30: 0.55 };
  function hiringModifiers(run, out, signedOffFailedGate) {
    const now = { revenue: 0, trust: 0, morale: 0, risk: 0 }, carry = { revenue: 0, trust: 0, morale: 0, risk: 0 };
    if (!run.fairness.passed)
      signedOffFailedGate ? (now.risk += 3, now.trust -= 2) : now.revenue -= 2;
    if (run.deferred > 0)
      now.morale -= 1;
    if (out.fillRate < 0.9)
      now.revenue -= 1;
    const churn = Math.round((out.stay30 - PERSON_BASELINE.stay30) * 10);
    carry.morale += Math.max(-3, Math.min(3, churn));
    return { now, carry };
  }

  // src/ui/main.ts
  var S = people_workforce_default;
  var R1 = S.rounds[0];
  var APPS = makeApplicants();
  var st = { choice: "", lim: { ...DEFAULT_HIRING_LIMITS }, decision: "" };
  var $ = (id) => document.getElementById(id);
  var pct = (x) => Math.round(x * 100) + "%";
  var sgn = (n) => (n > 0 ? "+" : "") + n;
  var MN = { revenue: "Revenue", trust: "Trust", morale: "Morale", risk: "Risk" };
  function result() {
    let g = newGame(S), extra = "";
    if (st.choice === "agent") {
      const run = runHiringAgent(APPS, 600, 9, st.lim), out = simulateOutcome(run);
      if (st.decision === "approve" || st.decision === "signoff") {
        sendOffers(run, "Recruiter R. Sen", run.shortlist.map((a) => a.id), st.decision === "signoff" ? "HR Lead" : undefined);
        g = playRound(S, g, "agent", undefined, false, hiringModifiers(run, out, st.decision === "signoff"));
      } else if (st.decision === "hold")
        g = playRound(S, g, "agent", undefined, false, hiringModifiers(run, { ...out, fillRate: out.fillRate }, false));
      else
        return null;
      extra = `<p class="muted">${run.audit.length} offers approved and logged. Filled ${pct(out.fillRate)} of places; ${pct(out.stay30)} expected to stay 30 days (last festival: ${pct(PERSON_BASELINE.stay30)}).</p>`;
    } else
      g = playRound(S, g, st.choice);
    return { g, extra };
  }
  function agentPanel() {
    const run = runHiringAgent(APPS, 600, 9, st.lim), out = simulateOutcome(run), f = run.fairness;
    const bar = (k, v, ref) => `<div class="row"><span>${k}</span><div class="bar"><i style="width:${Math.min(100, v * 600)}%"></i></div><b>${pct(v)}</b></div>`;
    const q = run.idCases > st.lim.reviewCapacity ? "bad" : "ok";
    const gate = f.passed ? `<button class="go" onclick="act('decision','approve')">Recruiter approves ${run.shortlist.length} offers</button>` : `<p class="bad">Fairness gate blocked: ratio ${f.ratio.toFixed(2)} is below 0.80. Offers cannot go out.</p>
       <button onclick="act('decision','hold')">Hold offers and fix the settings</button>
       <button class="warn" onclick="act('decision','signoff')">HR Lead signs off anyway</button>`;
    return `<div class="card"><h3>The hiring agent</h3>
    <label><input type="checkbox" ${st.lim.balancePins ? "checked" : ""} onchange="act('balancePins',this.checked)"> Reserve places for each pin-code group, in proportion to applicants</label>
    <label><input type="checkbox" ${!st.lim.idFirst ? "checked" : ""} onchange="act('idFirst',!this.checked)"> Check IDs only for the shortlist (not all applicants)</label>
    <label>Shortlist ${st.lim.overbook.toFixed(1)}x the places <input type="range" min="1" max="1.6" step="0.1" value="${st.lim.overbook}" oninput="act('overbook',+this.value)"></label>
    <label>Recruiters on ID review: ${st.lim.reviewCapacity / 20} of 12 <input type="range" min="2" max="12" step="1" value="${st.lim.reviewCapacity / 20}" oninput="act('reviewCapacity',+this.value*20)"></label>
    <h4>What the agent did</h4>
    <div class="funnel"><div><b>${run.applicants.toLocaleString()}</b>applications</div><div><b>${run.shortlist.length}</b>shortlisted, clear ID</div>
      <div class="${q}"><b>${run.idCases}</b>ID cases for people (capacity ${st.lim.reviewCapacity})</div><div><b>${pct(out.fillRate)}</b>places filled</div><div><b>${pct(out.stay30)}</b>stay 30 days</div></div>
    ${run.deferred ? `<p class="bad">${run.deferred} people are waiting in the ID queue, not rejected, because recruiters are full.</p>` : ""}
    <h4>Share shortlisted, by group (for audit only, never used to rank)</h4>
    ${bar("Women", f.rates.women, 0)}${bar("Men", f.rates.men, 0)}${bar("Low-income pin codes", f.rates.lowIncomePin, 0)}${bar("Other pin codes", f.rates.otherPin, 0)}
    <h4>Human gate</h4>${gate}</div>`;
  }
  function render() {
    const r = st.choice && (st.choice !== "agent" || st.decision) ? result() : null;
    $("app").innerHTML = `
  <header><small>Halcyon Basket · People &amp; Workforce · Round 1 · Days 1 to 3</small><h1>${R1.title}</h1><p>${R1.brief}</p></header>
  <div class="grid">${R1.choices.map((c) => `<button class="choice ${st.choice === c.id ? "on" : ""}" onclick="act('choice','${c.id}')">
    <b>${c.label}</b><small>${c.delegation}</small><span>${c.cost} units · net ${sgn(netScore(c.effects))}</span>
    ${c.humanCheckpoint === "No" ? '<em class="bad">No human checkpoint: breaks Governance rule 3</em>' : ""}</button>`).join("")}</div>
  ${st.choice ? `<div class="card"><b>${R1.choices.find((c) => c.id === st.choice).label}:</b> ${R1.choices.find((c) => c.id === st.choice).whatItDoes}</div>` : '<p class="muted">Pick how to hire.</p>'}
  ${st.choice === "agent" ? agentPanel() : ""}
  ${r ? `<div class="card res"><h3>Result after Round 1</h3><div class="scores">${Object.keys(MN).map((k) => `<div><small>${MN[k]}</small><b>${r.g.measures[k]}</b><span class="${(k === "risk" ? -1 : 1) * r.g.history[0].deltas[k] >= 0 ? "ok" : "bad"}">${sgn(r.g.history[0].deltas[k])}</span></div>`).join("")}
      <div><small>Company score</small><b>${companyScore(r.g.measures)}</b></div></div>
      ${r.g.history[0].boardSteppedIn ? '<p class="bad">The board steps in.</p>' : ""}${r.extra}
      ${r.g.carry.morale ? `<p class="muted">Carried to Round 4: Morale ${sgn(r.g.carry.morale)} (store teams feel the churn).</p>` : ""}
      ${r.g.history[0].note.map((n) => `<p class="muted">${n}</p>`).join("")}
      ${st.decision === "hold" ? '<p class="muted">Offers held: stores stay short-staffed while you fix the settings.</p>' : ""}</div>` : ""}`;
  }
  window.act = (k, v) => {
    if (k === "choice") {
      st.choice = v;
      st.decision = "";
    } else if (k === "decision")
      st.decision = v;
    else {
      st.lim[k] = v;
      st.decision = "";
    }
    render();
  };
  render();
})();
</script></body></html>
